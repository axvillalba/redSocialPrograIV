<app-navbar></app-navbar>

<main class="feed-container">
  <!-- Formulario de Creación de Publicaciones estilo Hextech/Zaun -->
  <section class="card-crear-post">
    <h3 class="title-crear">NUEVA PUBLICACIÓN EN LA GRIETA</h3>

    <div class="form-group">
      <label>TÍTULO</label>
      <input 
        type="text" 
        [(ngModel)]="nuevoPost.titulo" 
        placeholder="Título de tu publicación..." 
        [disabled]="creandoPost || subiendoImagen" 
      />
    </div>

    <div class="form-group">
      <label>MENSAJE</label>
      <textarea 
        [(ngModel)]="nuevoPost.descripcion" 
        placeholder="¿Qué querés compartir con los invocadores?" 
        [disabled]="creandoPost || subiendoImagen">
      </textarea>
    </div>

    <!-- Botón personalizado para subir archivos -->
    <div class="form-group">
      <label>IMAGEN DEL POSTEO</label>
      
      <div class="upload-zone" *ngIf="!nuevoPost.imagenUrl">
        <label class="btn-file-custom" [class.disabled]="subiendoImagen || creandoPost">
          <input 
            type="file" 
            accept="image/*" 
            (change)="onFileSelected($event)" 
            [disabled]="subiendoImagen || creandoPost" 
            hidden
          />
          <span *ngIf="!subiendoImagen">📁 SELECCIONAR IMAGEN</span>
          <span *ngIf="subiendoImagen">⏳ SUBIENDO A CLOUDINARY...</span>
        </label>
      </div>

      <!-- Previsualización -->
      <div class="preview-box" *ngIf="nuevoPost.imagenUrl">
        <img [src]="nuevoPost.imagenUrl" alt="Previsualización" />
        <button type="button" class="btn-delete-preview" (click)="quitarImagen()">❌ QUITAR FOTO</button>
      </div>
    </div>

    <button 
      type="button" 
      class="btn-hextech-submit" 
      (click)="crearPublicacion()" 
      [disabled]="creandoPost || subiendoImagen">
      <span *ngIf="!creandoPost">PUBLICAR</span>
      <span *ngIf="creandoPost">PUBLICANDO... ⏳</span>
    </button>
  </section>

  <!-- Filtro por Orden arriba del Feed -->
  <section class="orden-bar">
    <span class="lbl-orden">ORDENAR POR:</span>
    <button 
      type="button" 
      class="btn-filtro" 
      [class.activo]="ordenSeleccionado === 'fecha'" 
      (click)="cambiarOrden('fecha')">
      MÁS RECIENTES
    </button>
    <button 
      type="button" 
      class="btn-filtro" 
      [class.activo]="ordenSeleccionado === 'meGusta'" 
      (click)="cambiarOrden('meGusta')">
      MÁS ME GUSTA
    </button>
  </section>

  <!-- Spinner central sólo para carga de feed o cambio de página/orden -->
  <div class="spinner-container" *ngIf="cargandoFeed">
    <div class="spinner-hextech"></div>
    <p>CARGANDO PUBLICACIONES...</p>
  </div>

  <!-- Lista de publicaciones -->
  <section class="publicaciones-list" *ngIf="!cargandoFeed">
    <app-publicacion
      *ngFor="let pub of publicaciones"
      [publicacion]="pub"
      [usuarioActualId]="usuarioActualId"
      [procesandoLike]="idsProcesandoLike.has(pub._id)"
      (meGustaToggled)="handleLikeToggle(pub)"
      (eliminarSolicitado)="handleEliminar($event)">
    </app-publicacion>

    <div class="empty-feed" *ngIf="publicaciones.length === 0">
      <p>No hay publicaciones en la Grieta actualmente.</p>
    </div>
  </section>

  <!-- Paginación trasladada al FINAL de la página -->
  <section class="paginacion-bar-bottom" *ngIf="!cargandoFeed && publicaciones.length > 0">
    <button 
      type="button" 
      class="btn-pag" 
      (click)="paginaAnterior()" 
      [disabled]="offset === 0">
      ◀ ANTERIOR
    </button>
    <span class="num-pag">PÁG. {{ paginaActual }}</span>
    <button 
      type="button" 
      class="btn-pag" 
      (click)="paginaSiguiente()" 
      [disabled]="publicaciones.length < limit">
      SIGUIENTE ▶
    </button>
  </section>
</main>

<app-modal
  [mostrar]="modalState.mostrar"
  [titulo]="modalState.titulo"
  [mensaje]="modalState.mensaje"
  [tipo]="modalState.tipo"
  (alConfirmar)="cerrarModal()"
  (alCancelar)="cerrarModal()">
</app-modal>
