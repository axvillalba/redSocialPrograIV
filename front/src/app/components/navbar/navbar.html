<header class="navbar-container">
  <div class="logo-group" routerLink="/publicaciones">
    <span class="logo-icon">⚡</span>
    <h1 class="logo-text">LA GRIETA <span class="text-jinx">DEL INVOCADOR</span></h1>
  </div>

  <div class="user-menu" *ngIf="usuario">
    <div class="user-badge" routerLink="/perfil" title="Ir a mi perfil">
      <div class="nav-avatar-box">
        <img 
          [src]="obtenerAvatar()" 
          (error)="errorImagen($event)" 
          alt="Avatar de usuario" 
          class="nav-avatar-img" 
        />
      </div>
      <span class="nav-username">@{{ usuario.nombreUsuario || usuario.login }}</span>
    </div>

    <button type="button" class="btn-logout" (click)="cerrarSesion()">
      CERRAR SESIÓN
    </button>
  </div>
</header>
