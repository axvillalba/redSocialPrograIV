<header class="hextech-navbar">
  <!-- Marca / Logo con Núcleo Hextech -->
  <div class="nav-brand-section">
    <a routerLink="/publicaciones" class="brand-link">
      <div class="hextech-crest" aria-hidden="true">
        <svg class="brand-bolt" viewBox="0 0 24 24" fill="currentColor">
          <path d="M13 2L4.09 12.97H11L10 22L19.91 11.03H13L13 2Z" />
        </svg>
      </div>
      <div class="brand-titles">
        <div class="brand-main-line">
          <span class="brand-gold">LA GRIETA</span>
          <span class="brand-jinx">DEL INVOCADOR</span>
        </div>
        <span class="brand-subtag">PILTOVER // ZAUN NETWORK</span>
      </div>
    </a>
  </div>

  <!-- Navegación Central / Panel Admin -->
  <nav class="nav-actions-center" aria-label="Navegación principal">
    <a
      routerLink="/publicaciones"
      routerLinkActive="is-active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="hex-tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z" />
      </svg>
      <span>INICIO</span>
    </a>

    <!-- Directiva estructural propia *appSoloAdmin -->
    <div *appSoloAdmin class="admin-command-bar">
      <span class="admin-tag">⚡ ADMIN</span>

      <a routerLink="/dashboard/usuarios" routerLinkActive="is-active" class="hex-tab hex-tab-admin">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3z" />
        </svg>
        <span>USUARIOS</span>
      </a>

      <a routerLink="/dashboard/estadisticas" routerLinkActive="is-active" class="hex-tab hex-tab-admin">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 20V10M12 20V4M6 20v-6" stroke-linecap="round" />
        </svg>
        <span>ESTADÍSTICAS</span>
      </a>
    </div>
  </nav>

  <!-- Perfil, Audio y Cierre de Sesión -->
  <div class="nav-user-section">
    @if (usuario) {
      <a routerLink="/perfil" routerLinkActive="profile-active" class="profile-pill" title="Ver mi perfil de Invocador">
        <div class="avatar-ring">
          <img [src]="obtenerAvatar()" appAvatarFallback alt="Avatar de {{ usuario.nombreUsuario }}" />
          <span class="status-dot" title="Conectado en la Grieta"></span>
        </div>
        <div class="user-meta">
          <span class="user-handle">&#64;{{ usuario.nombreUsuario }}</span>
          <span class="user-role-sub">{{ esAdmin ? 'Consejo Admin' : 'Invocador' }}</span>
        </div>
      </a>
    }

    <div class="hex-divider"></div>

    <button
      type="button"
      class="btn-sonido-hextech"
      [class.activo]="sonidoActivo"
      (click)="toggleSonido()"
      [title]="sonidoActivo ? 'Silenciar efectos Hextech' : 'Activar sonidos Hextech'">
      {{ sonidoActivo ? '🔊' : '🔇' }}
    </button>

    <button type="button" class="btn-hex-logout" (click)="cerrarSesion()">
      CERRAR SESIÓN
    </button>
  </div>
</header>
