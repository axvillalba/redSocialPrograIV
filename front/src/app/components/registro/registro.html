<main class="registro-container">
  <div class="registro-card">
    <div class="card-header">
      <span class="header-icon">⚡</span>
      <h2 class="title">REGISTRO DE INVOCADOR</h2>
      <p class="subtitle">Sumate a la Grieta del Invocador y creá tu perfil</p>
    </div>

    <form [formGroup]="registroForm" (ngSubmit)="onSubmit()" class="registro-form">
      <!-- FILA 1: NOMBRE Y APELLIDO -->
      <div class="form-row">
        <div class="form-group">
          <label for="nombre">NOMBRE</label>
          <input 
            type="text" 
            id="nombre" 
            formControlName="nombre" 
            placeholder="Ej: Axel"
            [class.is-invalid]="registroForm.get('nombre')?.touched && registroForm.get('nombre')?.invalid"
          />
        </div>

        <div class="form-group">
          <label for="apellido">APELLIDO</label>
          <input 
            type="text" 
            id="apellido" 
            formControlName="apellido" 
            placeholder="Ej: Villalba"
            [class.is-invalid]="registroForm.get('apellido')?.touched && registroForm.get('apellido')?.invalid"
          />
        </div>
      </div>

      <!-- FILA 2: CORREO Y NOMBRE DE USUARIO -->
      <div class="form-row">
        <div class="form-group">
          <label for="correo">CORREO ELECTRÓNICO</label>
          <input 
            type="email" 
            id="correo" 
            formControlName="correo" 
            placeholder="ejemplo@lol.com"
            [class.is-invalid]="registroForm.get('correo')?.touched && registroForm.get('correo')?.invalid"
          />
        </div>

        <div class="form-group">
          <label for="nombreUsuario">NOMBRE DE USUARIO</label>
          <input 
            type="text" 
            id="nombreUsuario" 
            formControlName="nombreUsuario" 
            placeholder="axwalker"
            [class.is-invalid]="registroForm.get('nombreUsuario')?.touched && registroForm.get('nombreUsuario')?.invalid"
          />
        </div>
      </div>

      <!-- FILA 3: CONTRASEÑAS -->
      <div class="form-row">
        <div class="form-group">
          <label for="password">CONTRASEÑA</label>
          <input 
            type="password" 
            id="password" 
            formControlName="password" 
            placeholder="••••••••"
            [class.is-invalid]="registroForm.get('password')?.touched && registroForm.get('password')?.invalid"
          />
        </div>

        <div class="form-group">
          <label for="repetirPassword">REPETIR CONTRASEÑA</label>
          <input 
            type="password" 
            id="repetirPassword" 
            formControlName="repetirPassword" 
            placeholder="Repita su contraseña"
            [class.is-invalid]="registroForm.get('repetirPassword')?.touched && registroForm.get('repetirPassword')?.invalid"
          />
        </div>
      </div>

      <!-- FECHA DE NACIMIENTO -->
      <div class="form-group">
        <label for="fechaNacimiento">FECHA DE NACIMIENTO</label>
        <input 
          type="date" 
          id="fechaNacimiento" 
          formControlName="fechaNacimiento"
          [class.is-invalid]="registroForm.get('fechaNacimiento')?.touched && registroForm.get('fechaNacimiento')?.invalid"
        />
      </div>

      <!-- DESCRIPCIÓN BREVE -->
      <div class="form-group">
        <label for="descripcion">DESCRIPCIÓN BREVE</label>
        <textarea 
          id="descripcion" 
          formControlName="descripcion" 
          rows="3" 
          placeholder="Main Mid / Ahri lover...">
        </textarea>
      </div>

      <!-- FOTO DE PERFIL CON CLOUDINARY -->
      <div class="form-group">
        <label>FOTO DE PERFIL / AVATAR</label>
        <div class="upload-zone">
          <label class="btn-file-custom" [class.disabled]="subiendoImagen">
            <input 
              type="file" 
              accept="image/*" 
              (change)="onFileSelected($event)" 
              [disabled]="subiendoImagen" 
              hidden
            />
            <span *ngIf="!subiendoImagen && !imagenSubidaUrl">📁 SELECCIONAR ARCHIVO</span>
            <span *ngIf="subiendoImagen">⏳ SUBIENDO A CLOUDINARY...</span>
            <span *ngIf="imagenSubidaUrl && !subiendoImagen">✅ IMAGEN CARGADA CORRECTAMENTE</span>
          </label>
        </div>
      </div>

      <div class="alert-error" *ngIf="errorMensaje">
        ⚠️ {{ errorMensaje }}
      </div>

      <button 
        type="submit" 
        class="btn-hextech-submit" 
        [disabled]="registroForm.invalid || subiendoImagen || guardando">
        <span *ngIf="!guardando">REGISTRARSE</span>
        <span *ngIf="guardando">REGISTRANDO... ⏳</span>
      </button>
    </form>

    <footer class="card-footer">
      <p>¿Ya tenés cuenta? <a routerLink="/login" class="link-hextech">Iniciá sesión aquí</a></p>
    </footer>
  </div>
</main>
